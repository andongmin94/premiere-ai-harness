name: Product CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-main
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Core-${{ runner.os }}
          path: |
            dist/PremiereAIHarness-Core-*-uxp-source/
            dist/PremiereAIHarness-Core-*-uxp-source.manifest.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PremiereAIHarness-Core-*
          path: artifacts
      - name: Compare Linux and Windows source packages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function manifests(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) return manifests(full);
              return entry.name.endsWith('-uxp-source.manifest.json') ? [full] : [];
            });
          }
          const files = manifests('artifacts');
          if (files.length !== 2) throw new Error(`expected two package manifests, found ${files.length}`);
          const values = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const compact = (value) => JSON.stringify({
            version: value.version,
            packageKind: value.packageKind,
            installable: value.installable,
            treeSha256: value.treeSha256,
            entries: value.entries.map(({ path, bytes, sha256 }) => ({ path, bytes, sha256 })),
          });
          if (compact(values[0]) !== compact(values[1])) throw new Error('Linux and Windows source packages differ');
          NODE

  distribution:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:distribution
      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Core-Distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30
