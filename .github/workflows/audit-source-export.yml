name: Audit source export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Archive exact repository source
        run: git archive --format=zip --output=premiere-ai-harness-audit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: premiere-ai-harness-audit-source
          path: premiere-ai-harness-audit-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Record exact run id
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p audit
          printf '{"runId":%s,"headSha":"%s"}\n' "$RUN_ID" "$HEAD_SHA" > audit/source-export-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/source-export-run.json
          git commit -m 'chore: record audit source export [skip ci]'
          git push origin HEAD:main
