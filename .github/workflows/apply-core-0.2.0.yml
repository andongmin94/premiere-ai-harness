name: Apply Core 0.2.0 upgrade

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/core-0.2.0.part-*.b64
      - .github/workflows/apply-core-0.2.0.yml

permissions:
  contents: write

concurrency:
  group: apply-core-0.2.0
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify and apply reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core-0.2.0.part-*.b64 > /tmp/core-0.2.0.zip.b64
          base64 --decode /tmp/core-0.2.0.zip.b64 > /tmp/core-0.2.0.zip
          actual="$(sha256sum /tmp/core-0.2.0.zip | awk '{print $1}')"
          expected="fce85d10f4694a96120719c6a428cc2eb5cab31357b7ad66109703893409a6f0"
          test "$actual" = "$expected"
          unzip -q -o /tmp/core-0.2.0.zip -d .

          rm -rf tools reports .bootstrap
          rm -f \
            .github/workflows/aggregate-gates.yml \
            .github/workflows/export-full-source-result.yml \
            .github/workflows/export-full-source.yml \
            .github/workflows/host-gate-ci-result.yml \
            .github/workflows/host-gate-ci.yml \
            .github/workflows/offline-kit-ci.yml \
            .github/workflows/offline-kit-result.yml \
            .github/workflows/pre-premiere-e2e-result.yml \
            .github/workflows/pre-premiere-e2e.yml \
            .github/workflows/product-ci-result.yml \
            .github/workflows/qualification-runner.yml \
            .github/workflows/apply-core-0.2.0.yml

          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Commit verified Core upgrade directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: harden Core with in-plugin host certification [skip ci]'
          git push origin HEAD:main
