name: Publish audited Core 0.5.1 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-clean-core.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-audited-core-0.5.1-main
  cancel-in-progress: false

env:
  CLEAN_TREE_SHA: 54b72159e1eb2762fb3d064b8c31900f8fa8a634

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct the exact reviewed tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pai-clean
          mkdir -p /tmp/pai-clean
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const destination = '/tmp/pai-clean';
          const repository = process.env.GITHUB_REPOSITORY;
          const treeSha = process.env.CLEAN_TREE_SHA;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function getJson(endpoint) {
            const response = await fetch(`https://api.github.com/repos/${repository}${endpoint}`, { headers });
            if (!response.ok) throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }

          function outputPath(relative) {
            if (!relative || relative.startsWith('/') || relative.includes('\\')
              || relative.split('/').some((part) => !part || part === '.' || part === '..')) {
              throw new Error(`unsafe tree path: ${relative}`);
            }
            const output = path.resolve(destination, relative);
            if (!output.startsWith(`${destination}${path.sep}`)) throw new Error(`tree path escapes destination: ${relative}`);
            return output;
          }

          async function main() {
            const tree = await getJson(`/git/trees/${treeSha}?recursive=1`);
            if (tree.sha !== treeSha || tree.truncated) throw new Error('reviewed tree response is invalid or truncated');
            const blobs = tree.tree.filter((entry) => entry.type === 'blob').sort((a, b) => a.path.localeCompare(b.path, 'en'));
            if (!blobs.length || tree.tree.some((entry) => !['blob', 'tree'].includes(entry.type))) {
              throw new Error('reviewed tree contains an unsupported Git entry');
            }
            for (const entry of blobs) {
              if (!['100644', '100755'].includes(entry.mode)) throw new Error(`unsupported mode ${entry.mode}: ${entry.path}`);
              const blob = await getJson(`/git/blobs/${entry.sha}`);
              const bytes = Buffer.from(String(blob.content || '').replace(/\s+/g, ''), 'base64');
              const computed = crypto.createHash('sha1').update(Buffer.concat([
                Buffer.from(`blob ${bytes.length}\0`), bytes,
              ])).digest('hex');
              if (blob.sha !== entry.sha || blob.encoding !== 'base64' || computed !== entry.sha) {
                throw new Error(`blob verification failed: ${entry.path}`);
              }
              const output = outputPath(entry.path);
              fs.mkdirSync(path.dirname(output), { recursive: true });
              fs.writeFileSync(output, bytes, { mode: entry.mode === '100755' ? 0o755 : 0o644 });
            }
          }

          main().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

          git -C /tmp/pai-clean init -q
          git -C /tmp/pai-clean config core.autocrlf false
          git -C /tmp/pai-clean config core.filemode true
          git -C /tmp/pai-clean add -A
          test "$(git -C /tmp/pai-clean write-tree)" = "${CLEAN_TREE_SHA}"

      - name: Run the complete source and distribution gate
        working-directory: /tmp/pai-clean
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:distribution
          ! grep -RInE '(TODO|FIXME|HACK|XXX)' plugin scripts test --exclude-dir=node_modules
          find plugin scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          test "$(git write-tree)" = "${CLEAN_TREE_SHA}"

      - name: Replace product files without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          for entry in /tmp/pai-clean/* /tmp/pai-clean/.[!.]* /tmp/pai-clean/..?*; do
            [ -e "$entry" ] || continue
            [ "$(basename "$entry")" = ".git" ] && continue
            [ "$(basename "$entry")" = ".github" ] && continue
            cp -a "$entry" .
          done
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'workflow files must be cleaned separately through the authenticated contents API' >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo 'audited source produced no product-file changes' >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: replace staging debris with audited Core 0.5.1 source"
          git push origin HEAD:main
