name: Source Export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact source archive
        shell: bash
        run: git archive --format=zip --output=premiere-ai-harness-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: premiere-ai-harness-source
          path: premiere-ai-harness-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Record source export run
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp
          printf '{"runId":%s,"headSha":"%s"}\n' "$RUN_ID" "$HEAD_SHA" > tmp/source-export-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/source-export-run.json
          git commit -m "chore: record source export [skip ci]"
          git push origin HEAD:main
