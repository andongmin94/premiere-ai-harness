name: One-shot Core 0.5.0 payload audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-audit.yml

permissions:
  contents: write

concurrency:
  group: core-0.5.0-payload-audit
  cancel-in-progress: false

env:
  PAYLOAD_SHA256: 57b1e625fe335629eeb8f189a4a97f8328e8e05f9113514b2f8ac435f8a90cc8

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record audit start
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('tmp/payload-audit-run.json', `${JSON.stringify({
            formatVersion: 1,
            status: 'RUNNING',
            runId: Number(process.env.RUN_ID),
            triggerCommit: process.env.TRIGGER_SHA,
            payloadSha256: process.env.PAYLOAD_SHA256,
          }, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/payload-audit-run.json
          git commit -m "ci: start Core 0.5.0 payload audit [skip ci]"
          git push origin HEAD:main
          echo "CONTROL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify and extract the exact staged payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          cat .update/fixed-core-0.5.0.b64.* > payload.tar.gz.b64
          base64 --decode payload.tar.gz.b64 > payload.tar.gz
          echo "${PAYLOAD_SHA256}  payload.tar.gz" | sha256sum --check --strict
          while IFS= read -r entry; do
            normalized="${entry#./}"
            case "$normalized" in
              ""|/*|..|../*|*/..|*/../*)
                echo "unsafe archive entry: $entry" >&2
                exit 1
                ;;
            esac
          done < <(tar -tzf payload.tar.gz)
          tar -xzf payload.tar.gz -C candidate
          test -f candidate/package.json
          test -f candidate/package-lock.json
          test -f candidate/plugin/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install without lifecycle scripts
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete distribution verification
        working-directory: candidate
        shell: bash
        run: npm run verify:distribution | tee ../VERIFY_DISTRIBUTION.log

      - name: Run independent source and repository checks
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test ! -e .update
          test ! -e tmp
          test ! -e .github/workflows/apply-distribution-update.yml
          test ! -e .github/workflows/apply-fixed-core-0.5.0.yml
          ! grep -RInE '(TODO|FIXME|HACK|XXX)' plugin scripts test --exclude-dir=node_modules
          find plugin scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./plugin/manifest.json').version")"
          test "$package_version" = "$manifest_version"

      - name: Create audit metadata
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ccx = fs.readdirSync('dist').find((name) => name.endsWith('.ccx'));
          const sourceManifest = fs.readdirSync('dist').find((name) => name.endsWith('-uxp-source.manifest.json'));
          if (!ccx || !sourceManifest) throw new Error('distribution artifacts were not produced');
          const ccxBytes = fs.readFileSync(path.join('dist', ccx));
          const source = JSON.parse(fs.readFileSync(path.join('dist', sourceManifest), 'utf8'));
          const metadata = {
            formatVersion: 1,
            status: 'PASS',
            payloadSha256: process.env.PAYLOAD_SHA256,
            triggerCommit: process.env.GITHUB_SHA,
            version: packageJson.version,
            sourceTreeSha256: source.treeSha256,
            ccx,
            ccxBytes: ccxBytes.length,
            ccxSha256: crypto.createHash('sha256').update(ccxBytes).digest('hex'),
          };
          fs.writeFileSync('../PAYLOAD_AUDIT.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          rm -rf node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Core-0.5.0-Payload-Audit
          path: |
            candidate/
            PAYLOAD_AUDIT.json
            VERIFY_DISTRIBUTION.log
          if-no-files-found: error
          retention-days: 1

      - name: Record final audit result
        if: ${{ always() }}
        shell: bash
        env:
          AUDIT_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${CONTROL_SHA}" || {
            echo 'main moved during payload audit; refusing stale receipt' >&2
            exit 1
          }
          git reset --hard "${CONTROL_SHA}"
          node <<'NODE'
          const fs = require('node:fs');
          let audit = {};
          if (fs.existsSync('PAYLOAD_AUDIT.json')) audit = JSON.parse(fs.readFileSync('PAYLOAD_AUDIT.json', 'utf8'));
          const passed = process.env.AUDIT_RESULT === 'success';
          const receipt = {
            formatVersion: 1,
            status: passed ? 'PASS' : 'FAIL',
            runId: Number(process.env.RUN_ID),
            triggerCommit: process.env.TRIGGER_SHA,
            payloadSha256: process.env.PAYLOAD_SHA256,
            version: audit.version || null,
            sourceTreeSha256: audit.sourceTreeSha256 || null,
            ccxSha256: audit.ccxSha256 || null,
          };
          fs.writeFileSync('tmp/payload-audit-run.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git add tmp/payload-audit-run.json
          git commit -m "ci: record Core 0.5.0 payload audit [skip ci]"
          git push origin HEAD:main
