name: Remove temporary branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-temporary-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/codex/initial-source-import" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup-temp-branch" || true
