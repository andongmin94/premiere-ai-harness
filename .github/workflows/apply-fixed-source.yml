# Triggered through the contents API so GitHub Actions receives a normal push event.
name: Apply verified Core 0.3.1 source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/core-0.3.1.part-*"
      - ".github/workflows/apply-fixed-source.yml"

permissions:
  contents: write

concurrency:
  group: apply-core-0.3.1
  cancel-in-progress: false

env:
  ARCHIVE_SHA256: 8e6938a69b8933b0bee73247c49cba1bf262499e47f9e598afde09fecf64cde7
  SOURCE_DIR_NAME: PremiereAIHarness-Core-0.3.1-Fixed-Source

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and verify source on Linux
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core-0.3.1.part-* > "$RUNNER_TEMP/core-0.3.1.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/core-0.3.1.tar.xz.b64" > "$RUNNER_TEMP/core-0.3.1.tar.xz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/core-0.3.1.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/core-0.3.1"
          tar -xJf "$RUNNER_TEMP/core-0.3.1.tar.xz" -C "$RUNNER_TEMP/core-0.3.1"
          cd "$RUNNER_TEMP/core-0.3.1/$SOURCE_DIR_NAME"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run verify

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and verify source on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(Get-ChildItem -LiteralPath ".bootstrap" -Filter "core-0.3.1.part-*" | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected 5 source archive parts, found $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "core-0.3.1.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ARCHIVE_SHA256) { throw "Archive SHA-256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP "core-0.3.1"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar -xJf $archive -C $extract
          Set-Location (Join-Path $extract $env:SOURCE_DIR_NAME)
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run verify

  apply:
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace repository with the verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core-0.3.1.part-* > "$RUNNER_TEMP/core-0.3.1.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/core-0.3.1.tar.xz.b64" > "$RUNNER_TEMP/core-0.3.1.tar.xz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/core-0.3.1.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/core-0.3.1"
          tar -xJf "$RUNNER_TEMP/core-0.3.1.tar.xz" -C "$RUNNER_TEMP/core-0.3.1"
          SRC="$RUNNER_TEMP/core-0.3.1/$SOURCE_DIR_NAME"
          test -f "$SRC/package.json"
          test -f "$SRC/plugin/manifest.json"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf node_modules dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize Core 0.3.1"
          git push origin HEAD:main
