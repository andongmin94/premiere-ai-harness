name: Apply verified Core 0.3.1 source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/core-0.3.1.part-*"
      - ".github/workflows/apply-fixed-source.yml"

permissions:
  contents: write

concurrency:
  group: apply-core-0.3.1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct, verify, and apply source
        shell: bash
        env:
          ARCHIVE_SHA256: 8e6938a69b8933b0bee73247c49cba1bf262499e47f9e598afde09fecf64cde7
          SOURCE_DIR_NAME: PremiereAIHarness-Core-0.3.1-Fixed-Source
        run: |
          set -euo pipefail
          cat .bootstrap/core-0.3.1.part-* > "$RUNNER_TEMP/core-0.3.1.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/core-0.3.1.tar.xz.b64" > "$RUNNER_TEMP/core-0.3.1.tar.xz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/core-0.3.1.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/core-0.3.1"
          tar -xJf "$RUNNER_TEMP/core-0.3.1.tar.xz" -C "$RUNNER_TEMP/core-0.3.1"
          SRC="$RUNNER_TEMP/core-0.3.1/$SOURCE_DIR_NAME"
          test -f "$SRC/package.json"
          test -f "$SRC/plugin/manifest.json"

          cd "$SRC"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run verify
          cd "$GITHUB_WORKSPACE"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf node_modules dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize Core 0.3.1"
          git push origin HEAD:main
