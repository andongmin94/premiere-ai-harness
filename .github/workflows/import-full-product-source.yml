name: Import full product source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-full-product-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-full-product-source
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and validate reviewed source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zipfile

          repo = pathlib.Path.cwd()
          archive_dir = repo / 'source-archive'
          manifest_path = archive_dir / 'manifest.json'
          if not manifest_path.is_file():
              raise SystemExit('source-archive/manifest.json is missing')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          if manifest.get('encoding') != 'base64-concatenated':
              raise SystemExit('unsupported source archive encoding')

          encoded = bytearray()
          seen = set()
          for item in manifest.get('parts', []):
              name = item['name']
              if name in seen:
                  raise SystemExit(f'duplicate source part: {name}')
              seen.add(name)
              path = archive_dir / name
              raw = path.read_bytes()
              if len(raw) != int(item['bytes']):
                  raise SystemExit(f'source part size mismatch: {name}')
              digest = hashlib.sha256(raw).hexdigest()
              if digest.lower() != item['sha256'].lower():
                  raise SystemExit(f'source part sha256 mismatch: {name}')
              encoded.extend(raw)

          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != int(manifest['archiveBytes']):
              raise SystemExit('source archive byte size mismatch')
          digest = hashlib.sha256(archive).hexdigest()
          if digest.lower() != manifest['archiveSha256'].lower():
              raise SystemExit('source archive sha256 mismatch')

          work = repo / '.import-work'
          work.mkdir(exist_ok=True)
          archive_path = work / manifest['archive']
          archive_path.write_bytes(archive)
          extract = work / 'extracted'
          extract.mkdir(exist_ok=True)

          with zipfile.ZipFile(archive_path) as zf:
              for info in zf.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      raise SystemExit(f'symlink not allowed: {info.filename}')
              zf.extractall(extract)

          candidates = sorted(p.parent for p in extract.rglob('package.json') if 'node_modules' not in p.parts)
          if not candidates:
              raise SystemExit('no package.json found in source archive')
          roots = []
          for p in candidates:
              if not any(parent in roots for parent in p.parents):
                  roots.append(p)
          source_root = roots[0]
          (work / 'source-root.txt').write_text(str(source_root), encoding='utf-8')
          print(f'archive_sha256={digest}')
          print(f'source_root={source_root}')
          PY
          echo "source_root=$(cat .import-work/source-root.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify full product source before import
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.source.outputs.source_root }}'
          cd "$root"
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm run verify

      - name: Import source while preserving verified qualification runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil

          repo = pathlib.Path.cwd()
          source_root = pathlib.Path((repo / '.import-work/source-root.txt').read_text(encoding='utf-8').strip())
          preserve = {
              pathlib.PurePosixPath('.git'),
              pathlib.PurePosixPath('.github'),
              pathlib.PurePosixPath('tools/qualification-runner'),
              pathlib.PurePosixPath('.import-work'),
              pathlib.PurePosixPath('source-archive'),
          }

          def is_preserved(rel: pathlib.PurePosixPath) -> bool:
              return any(rel == p or p in rel.parents for p in preserve)

          for child in list(repo.iterdir()):
              rel = pathlib.PurePosixPath(child.name)
              if is_preserved(rel):
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          excluded_top = {'.git', '.github', 'node_modules', 'dist', 'build', 'coverage', 'source-archive'}
          for src in source_root.iterdir():
              if src.name in excluded_top:
                  continue
              if src.name == 'tools':
                  dst_tools = repo / 'tools'
                  dst_tools.mkdir(exist_ok=True)
                  for tool in src.iterdir():
                      if tool.name == 'qualification-runner':
                          continue
                      dst = dst_tools / tool.name
                      if dst.exists():
                          shutil.rmtree(dst) if dst.is_dir() else dst.unlink()
                      shutil.copytree(tool, dst) if tool.is_dir() else shutil.copy2(tool, dst)
                  continue
              dst = repo / src.name
              if dst.exists():
                  shutil.rmtree(dst) if dst.is_dir() else dst.unlink()
              shutil.copytree(src, dst) if src.is_dir() else shutil.copy2(src, dst)

          for obsolete in [
              repo / 'source-archive',
              repo / 'scripts/reconstruct-source.mjs',
              repo / '.github/workflows/bootstrap-ci.yml',
              repo / '.github/workflows/export-runner-source.yml',
              repo / '.github/workflows/import-full-product-source.yml',
          ]:
              if obsolete.is_dir():
                  shutil.rmtree(obsolete, ignore_errors=True)
              elif obsolete.exists():
                  obsolete.unlink()

          shutil.rmtree(repo / '.import-work', ignore_errors=True)
          PY

      - name: Re-run verification from imported repository tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm run verify
          cd tools/qualification-runner
          go test ./...
          go vet ./...

      - name: Commit imported source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import full Premiere AI Harness source'
          git push origin HEAD:main
