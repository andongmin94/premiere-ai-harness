name: Aggregate automation gates

on:
  push:
    branches: [main]
    paths:
      - reports/product-ci.json
      - reports/offline-kit-ci.json
      - reports/pre-premiere-e2e.json
      - reports/host-gate-ci.json
      - .github/workflows/aggregate-gates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact receipts, repository shape, and main-only policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          required = {
              'product': pathlib.Path('reports/product-ci.json'),
              'offlineKit': pathlib.Path('reports/offline-kit-ci.json'),
              'prePremiereE2E': pathlib.Path('reports/pre-premiere-e2e.json'),
              'hostGate': pathlib.Path('reports/host-gate-ci.json'),
          }
          receipts = {}
          for name, path in required.items():
              if not path.is_file():
                  raise SystemExit(f'missing receipt: {path}')
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              if data.get('status') != 'PASS':
                  raise SystemExit(f'{path} is not PASS')
              sha = str(data.get('headSha', '')).strip()
              if len(sha) != 40:
                  raise SystemExit(f'{path} has invalid headSha')
              result = subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'])
              if result.returncode != 0:
                  raise SystemExit(f'{path} does not describe an ancestor of main')
              receipts[name] = data

          for path in [
              pathlib.Path('package.json'),
              pathlib.Path('plugin/manifest.json'),
              pathlib.Path('helper/src/server.js'),
              pathlib.Path('tools/qualification-runner/go.mod'),
              pathlib.Path('tools/host-gate/go.mod'),
              pathlib.Path('.github/workflows/premiere-host-qualification-v2.yml'),
          ]:
              if not path.exists():
                  raise SystemExit(f'required product path is missing: {path}')

          obsolete = [
              pathlib.Path('source-archive'),
              pathlib.Path('scripts/reconstruct-source.mjs'),
              pathlib.Path('.github/workflows/bootstrap-ci.yml'),
              pathlib.Path('.github/workflows/import-full-product-source.yml'),
              pathlib.Path('.github/workflows/premiere-host-qualification.yml'),
          ]
          present = [str(p) for p in obsolete if p.exists()]
          if present:
              raise SystemExit('obsolete paths remain: ' + ', '.join(present))

          refs = subprocess.check_output(['git', 'ls-remote', '--heads', 'origin'], text=True)
          branches = sorted(line.rsplit('refs/heads/', 1)[-1] for line in refs.splitlines() if 'refs/heads/' in line)
          if branches != ['main']:
              raise SystemExit(f'main-only branch policy violated: {branches}')

          status = {
              'formatVersion': 1,
              'status': 'PASS',
              'branchPolicy': 'main-only',
              'automatedGates': receipts,
              'premiereHostGate': 'PENDING_REAL_ADOBE_HOST',
          }
          pathlib.Path('reports').mkdir(exist_ok=True)
          pathlib.Path('reports/automation-gates.json').write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit machine-readable aggregate status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/automation-gates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record aggregate automation gates [skip ci]'
          git push origin HEAD:main
