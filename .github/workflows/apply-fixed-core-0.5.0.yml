name: Apply fixed Core 0.5.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fixed-core-0.5.0.yml

permissions:
  contents: write

concurrency:
  group: apply-fixed-core-0.5.0-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify and extract the reviewed fixed source
        shell: bash
        run: |
          set -euo pipefail
          cat .update/fixed-core-0.5.0.b64.* > /tmp/fixed-core-0.5.0.tar.gz.b64
          base64 --decode /tmp/fixed-core-0.5.0.tar.gz.b64 > /tmp/fixed-core-0.5.0.tar.gz
          echo "57b1e625fe335629eeb8f189a4a97f8328e8e05f9113514b2f8ac435f8a90cc8  /tmp/fixed-core-0.5.0.tar.gz" | sha256sum --check --strict
          while IFS= read -r entry; do
            normalized="${entry#./}"
            case "$normalized" in
              ""|/*|..|../*|*/..|*/../*)
                echo "unsafe archive entry: $entry" >&2
                exit 1
                ;;
            esac
          done < <(tar -tzf /tmp/fixed-core-0.5.0.tar.gz)
          tar -xzf /tmp/fixed-core-0.5.0.tar.gz -C .
          rm -rf .update
          rm -f tmp/source-export-run.json
          rmdir tmp 2>/dev/null || true

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:distribution

      - name: Commit the verified fixed source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "workflow files must not be changed by the payload commit" >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo "fixed payload produced no tracked changes" >&2
            exit 1
          }
          git commit -m "fix: harden Core 0.5.0 transcript and persistence qualification"
          git push origin HEAD:main
