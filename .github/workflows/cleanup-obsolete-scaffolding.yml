name: Cleanup obsolete scaffolding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-scaffolding.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove obsolete one-off and superseded paths
        run: |
          rm -f .github/workflows/premiere-host-qualification.yml
          rm -f .github/workflows/export-runner-source.yml
          rm -f .github/workflows/bootstrap-ci.yml
          rm -f .github/workflows/import-full-product-source.yml
          rm -rf source-archive
          rm -f scripts/reconstruct-source.mjs
          rm -f .github/workflows/cleanup-obsolete-scaffolding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove obsolete import and host scaffolding [skip ci]'
          git push origin HEAD:main
