name: Product CI
# GitHub-hosted runners only; no self-hosted runner is required.

on:
  push:
    branches: [main]
    paths-ignore:
      - reports/product-ci.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-ci-main
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Core-${{ runner.os }}
          path: |
            dist/PremiereAIHarness-Core-0.3.1-uxp-source/
            dist/PremiereAIHarness-Core-0.3.1-uxp-source.manifest.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare Linux and Windows packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PremiereAIHarness-Core-*
          path: artifacts
      - name: Require byte-identical package manifests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const artifactNames = ["PremiereAIHarness-Core-Linux", "PremiereAIHarness-Core-Windows"];
          const manifests = artifactNames.map((artifactName) => {
            const file = path.join("artifacts", artifactName, "PremiereAIHarness-Core-0.3.1-uxp-source.manifest.json");
            return { artifactName, value: JSON.parse(fs.readFileSync(file, "utf8")) };
          });
          const [linux, windows] = manifests;
          if (linux.value.treeSha256 !== windows.value.treeSha256) {
            throw new Error(`cross-platform tree mismatch: ${linux.value.treeSha256} != ${windows.value.treeSha256}`);
          }
          const compact = (value) => JSON.stringify(value.entries.map(({ path, bytes, sha256 }) => ({ path, bytes, sha256 })));
          if (compact(linux.value) !== compact(windows.value)) {
            throw new Error("cross-platform package entry manifests differ");
          }
          fs.writeFileSync("cross-platform-package.json", `${JSON.stringify({
            formatVersion: 1,
            status: "PASS",
            version: linux.value.version,
            treeSha256: linux.value.treeSha256,
            artifacts: artifactNames
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Core-CrossPlatformReceipt
          path: cross-platform-package.json
          if-no-files-found: error
          retention-days: 30

  record:
    name: Record CI result
    needs: [verify, compare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: ${{ needs.verify.result == 'success' && needs.compare.result == 'success' }}
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        if: ${{ needs.verify.result == 'success' && needs.compare.result == 'success' }}
        with:
          name: PremiereAIHarness-Core-CrossPlatformReceipt
          path: ci-receipt
      - if: ${{ needs.verify.result == 'success' && needs.compare.result == 'success' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: ${{ needs.verify.result == 'success' && needs.compare.result == 'success' }}
        run: npm run package
      - name: Create machine-readable CI receipt
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          COMPARE_RESULT: ${{ needs.compare.result }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const passed = process.env.VERIFY_RESULT === "success" && process.env.COMPARE_RESULT === "success";
          const receipt = {
            formatVersion: 1,
            status: passed ? "PASS" : "FAIL",
            version: "0.3.1",
            verifiedCommit: process.env.VERIFIED_SHA,
            runId: Number(process.env.RUN_ID),
            runAttempt: Number(process.env.RUN_ATTEMPT),
            verifyResult: process.env.VERIFY_RESULT,
            compareResult: process.env.COMPARE_RESULT,
            runners: ["ubuntu-latest", "windows-latest"],
            crossPlatformReproducible: false,
            artifacts: ["PremiereAIHarness-Core-Linux", "PremiereAIHarness-Core-Windows"],
            packageKind: null,
            installable: false,
            treeSha256: null,
            recordedAt: new Date().toISOString()
          };
          if (passed) {
            const manifest = JSON.parse(fs.readFileSync("dist/PremiereAIHarness-Core-0.3.1-uxp-source.manifest.json", "utf8"));
            const crossPlatform = JSON.parse(fs.readFileSync("ci-receipt/cross-platform-package.json", "utf8"));
            if (manifest.treeSha256 !== crossPlatform.treeSha256) {
              throw new Error(`record package mismatch: ${manifest.treeSha256} != ${crossPlatform.treeSha256}`);
            }
            receipt.crossPlatformReproducible = true;
            receipt.packageKind = manifest.packageKind;
            receipt.installable = manifest.installable;
            receipt.treeSha256 = manifest.treeSha256;
          }
          fs.mkdirSync("reports", { recursive: true });
          fs.writeFileSync("reports/product-ci.json", `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Commit receipt only when main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}" || {
            echo "main moved while CI was running; refusing to write a stale receipt"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/product-ci.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: record Core 0.3.1 result [skip ci]"
          git push origin HEAD:main
