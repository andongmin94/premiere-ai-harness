name: Remove one-shot workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-one-shot-workflows.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: remove-one-shot-workflows-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only the permanent Product CI workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/product-ci.yml
          find .github/workflows -maxdepth 1 -type f ! -name product-ci.yml -print -delete
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git add -A .github/workflows
          git diff --cached --quiet && {
            echo 'no one-shot workflows remained' >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-shot development workflows"
          git push origin HEAD:main

      - name: Dispatch the permanent Product CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/product-ci.yml/dispatches" \
              -d '{"ref":"main"}'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
