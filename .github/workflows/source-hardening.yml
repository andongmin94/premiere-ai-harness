name: Source hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-hardening-main
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Remove the project-wide name-based recovery path
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.5.1"
          test -f plugin/lib/qualification-record.js
          test -f plugin/lib/sequence-snapshot.js
          cat > /tmp/harden.py <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def remove_function(text: str, name: str) -> str:
              match = re.search(rf'(?m)^([ \t]*)(?:async\s+)?function\s+{re.escape(name)}\s*\(', text)
              if not match:
                  return text
              start = match.start()
              brace = text.find('{', match.end())
              if brace < 0:
                  raise RuntimeError(f'opening brace not found for {name}')
              depth = 0
              quote = None
              escape = False
              for index in range(brace, len(text)):
                  char = text[index]
                  if quote:
                      if escape:
                          escape = False
                      elif char == '\\':
                          escape = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"`":
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(text) and text[end] in ' \t':
                              end += 1
                          while end < len(text) and text[end] in '\r\n':
                              end += 1
                          return text[:start] + text[end:]
              raise RuntimeError(f'unbalanced function {name}')

          def remove_test(text: str, title: str) -> str:
              position = text.find(title)
              if position < 0:
                  return text
              start = text.rfind('\ntest(', 0, position)
              if start < 0:
                  raise RuntimeError(f'test start not found: {title}')
              start += 1
              opening = text.find('(', start)
              depth = 0
              quote = None
              escape = False
              for index in range(opening, len(text)):
                  char = text[index]
                  if quote:
                      if escape:
                          escape = False
                      elif char == '\\':
                          escape = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"`":
                      quote = char
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          if text[end:end + 1] == ';':
                              end += 1
                          while end < len(text) and text[end] in '\r\n':
                              end += 1
                          return text[:start] + text[end:]
              raise RuntimeError(f'unbalanced test: {title}')

          path = root / 'plugin/index.html'
          text = path.read_text()
          text, count = re.subn(r'\s*<button\b[^>]*\bid=["\']cleanup-self-test["\'][^>]*>.*?</button>\s*', '\n', text, flags=re.S | re.I)
          if count != 1:
              raise RuntimeError(f'expected one cleanup button, removed {count}')
          path.write_text(text)

          path = root / 'plugin/index.js'
          text = path.read_text()
          text = re.sub(r'^\s*view\.bind\(["\']cleanup-self-test["\'],\s*["\']click["\'],\s*cleanupSelfTestArtifacts\);\s*\n', '', text, flags=re.M)
          text = remove_function(text, 'cleanupSelfTestArtifacts')
          text = re.sub(r'^\s*cleanupSelfTestArtifacts,\s*\n', '', text, flags=re.M)
          path.write_text(text)

          path = root / 'plugin/lib/premiere-adapter.js'
          text = path.read_text()
          text = remove_function(text, 'cleanupSelfTestArtifacts')
          text = re.sub(r'^\s*cleanupSelfTestArtifacts,\s*\n', '', text, flags=re.M)
          path.write_text(text)

          path = root / 'plugin/lib/generated-cleanup.js'
          text = path.read_text()
          text = re.sub(r'^\s*const MAX_FOLDER_SCAN\s*=.*?;\s*\n', '', text, flags=re.M)
          text = re.sub(r'^\s*const MAX_FOLDER_DEPTH\s*=.*?;\s*\n', '', text, flags=re.M)
          for name in ['cleanupInternalArtifacts', 'removeRecoveryFolder', 'findInternalFolders']:
              text = remove_function(text, name)
          text = text.replace('return { cleanupGenerated, cleanupInternalArtifacts, findInternalFolders };', 'return { cleanupGenerated };')
          text = re.sub(r'\bcleanupInternalArtifacts\s*,\s*', '', text)
          text = re.sub(r'\bfindInternalFolders\s*,\s*', '', text)
          path.write_text(text)

          path = root / 'test/premiere-adapter.test.js'
          path.write_text(remove_test(path.read_text(), 'recovery cleanup removes exact internal names and preserves output and user bins'))

          for relative in [
              'scripts/check.mjs', 'README.md', 'STATUS.md', 'docs/ARCHITECTURE.md',
              'docs/RELEASE_CHECKLIST_KO.md', 'docs/UNINSTALL_KO.md', 'plugin/README.txt',
              'plugin/lib/ui-view.js', 'test/panel-controller.test.js', 'test/premiere-fixture.js',
          ]:
              path = root / relative
              if not path.exists():
                  continue
              lines = [
                  line for line in path.read_text().splitlines()
                  if not any(token in line for token in [
                      'cleanup-self-test', 'cleanupSelfTestArtifacts',
                      'cleanupInternalArtifacts', 'findInternalFolders',
                  ])
              ]
              path.write_text('\n'.join(lines) + '\n')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['scripts']['lint'] = 'eslint plugin scripts test'
          package['scripts']['check:adobe-types'] = 'tsc -p tsconfig.adobe.json'
          package['scripts']['verify'] = 'npm run check && npm run lint && npm run check:adobe-types && npm run complexity && npm run test:coverage && npm run package && npm run test:package'
          package['devDependencies'] = {
              '@adobe/eslint-plugin-premierepro': '26.3.0',
              '@adobe/premierepro': '26.3.0',
              'eslint': '9.39.1',
              'typescript': '5.9.3',
          }
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')
          PY
          python3 /tmp/harden.py

      - name: Add permanent lint and official Adobe API contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > eslint.config.mjs <<'EOF'
          import adobePremiere from "@adobe/eslint-plugin-premierepro";

          const premiereRules = Object.fromEntries(
            Object.keys(adobePremiere.rules || {}).map((name) => [`premierepro/${name}`, "error"])
          );
          if (Object.keys(premiereRules).length === 0) {
            throw new Error("Adobe Premiere Pro ESLint plugin did not expose any rules");
          }

          const globals = {
            globalThis: "readonly", window: "readonly", module: "readonly", require: "readonly",
            document: "readonly", localStorage: "readonly", console: "readonly", process: "readonly",
            Buffer: "readonly", URL: "readonly", setTimeout: "readonly", clearTimeout: "readonly",
          };

          const coreRules = {
            "no-undef": "error",
            "no-unused-vars": ["error", { argsIgnorePattern: "^_", caughtErrorsIgnorePattern: "^_" }],
            "no-unreachable": "error", "no-dupe-keys": "error", "no-fallthrough": "error",
            "no-unsafe-finally": "error", "no-useless-catch": "error", "no-useless-return": "error",
            "no-self-assign": "error", "no-constant-binary-expression": "error", eqeqeq: ["error", "always"],
          };

          export default [
            { ignores: ["dist/**", "node_modules/**", "vendor/**"] },
            {
              files: ["plugin/**/*.js", "test/**/*.js"],
              plugins: { premierepro: adobePremiere },
              languageOptions: { ecmaVersion: 2022, sourceType: "script", globals },
              rules: { ...premiereRules, ...coreRules },
            },
            {
              files: ["scripts/**/*.mjs"],
              languageOptions: { ecmaVersion: 2022, sourceType: "module", globals },
              rules: coreRules,
            },
          ];
          EOF

          cat > tsconfig.adobe.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false,
              "types": []
            },
            "files": ["test/adobe-api-contract.ts"]
          }
          EOF

          cat > test/adobe-api-contract.ts <<'EOF'
          import type { premierepro } from "@adobe/premierepro";

          declare const ppro: premierepro;

          async function verifyPremiere263Surface(): Promise<void> {
            const project = await ppro.Project.getActiveProject();
            if (!project) return;
            const selection = await ppro.ProjectUtils.getSelection(project);
            const items = await selection.getItems();
            const clip = ppro.ClipProjectItem.cast(items[0]);
            const folder = ppro.FolderItem.cast(items[0]);

            void ppro.Transcript.hasTranscript;
            void ppro.Transcript.exportToJSON;
            void ppro.FrameRate.createWithValue;
            void ppro.TickTime.createWithFrameAndFrameRate;
            void project.lockedAccess;
            void project.executeTransaction;
            void project.getSequences;
            void project.getActiveSequence;
            void project.setActiveSequence;
            void project.createSequenceFromMedia;
            void project.closeSequence;
            void project.deleteSequence;
            void project.save;

            if (clip) {
              void clip.isOffline;
              void clip.isSequence;
              void clip.isMergedClip;
              void clip.isMulticamClip;
              void clip.createSubClipAction;
              void clip.getMedia;
              void clip.getFootageInterpretation;
              void clip.getParentBin;
              void clip.getId;
            }
            if (folder) {
              void folder.getItems;
              void folder.createBinAction;
              void folder.createMoveItemAction;
              void folder.createRemoveItemAction;
            }
            for (const sequence of await project.getSequences()) {
              void sequence.getEndTime;
              void sequence.getVideoTrackCount;
              void sequence.getAudioTrackCount;
              void sequence.getVideoTrack;
              void sequence.getAudioTrack;
            }
          }

          void verifyPremiere263Surface;
          EOF

      - name: Regenerate the lockfile and run every source gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:distribution
          ! grep -RInE '(TODO|FIXME|HACK|XXX)' plugin scripts test --exclude-dir=node_modules
          find plugin scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          for token in cleanup-self-test cleanupSelfTestArtifacts cleanupInternalArtifacts findInternalFolders MAX_FOLDER_SCAN MAX_FOLDER_DEPTH; do
            ! grep -RIn "$token" plugin scripts test
          done

      - name: Commit only verified product-source changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset -- .github/workflows
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'workflow files must not be included in the product commit' >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo 'source hardening produced no changes' >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: harden source ownership and Adobe 26.3 contract"
          git push origin HEAD:main
