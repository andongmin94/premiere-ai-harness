name: Source Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - reports/product-ci.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-snapshot-main
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=premiere-ai-harness-source.zip HEAD
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('SOURCE_SNAPSHOT.json', `${JSON.stringify({
            formatVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: PremiereAIHarness-Source-Snapshot
          path: |
            premiere-ai-harness-source.zip
            SOURCE_SNAPSHOT.json
          if-no-files-found: error
          retention-days: 30
