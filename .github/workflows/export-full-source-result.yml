name: Record full source export

on:
  workflow_run:
    workflows: ["Export full source"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record successful export run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p reports
          printf '{"status":"PASS","runId":%s,"headSha":"%s"}\n' "$RUN_ID" "$HEAD_SHA" > reports/full-source-export.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/full-source-export.json
          git commit -m 'ci: record full source export [skip ci]'
          git push origin HEAD:main
