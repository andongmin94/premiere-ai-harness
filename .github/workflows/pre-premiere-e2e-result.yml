name: Record pre-Premiere E2E result

on:
  workflow_run:
    workflows: ["Pre-Premiere end-to-end"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record exact successful run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p reports
          cat > reports/pre-premiere-e2e.json <<EOF
          {
            "status": "PASS",
            "workflow": "Pre-Premiere end-to-end",
            "runId": "${RUN_ID}",
            "headSha": "${HEAD_SHA}",
            "runUrl": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/pre-premiere-e2e.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record pre-Premiere E2E result [skip ci]'
          git push origin HEAD:main
