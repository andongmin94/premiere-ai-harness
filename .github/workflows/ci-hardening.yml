name: Harden permanent Product CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-hardening.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: harden-product-ci-main
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the final cross-platform product gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/product-ci.yml <<'EOF'
          name: Product CI

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: product-ci-main
            cancel-in-progress: true

          jobs:
            verify:
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, windows-latest]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                - run: npm ci --ignore-scripts --no-audit --no-fund
                - run: npm run verify:distribution
                - uses: actions/upload-artifact@v4
                  with:
                    name: distribution-${{ runner.os }}
                    path: dist/
                    if-no-files-found: error
                    retention-days: 30

            compare:
              needs: verify
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/download-artifact@v4
                  with:
                    pattern: distribution-*
                    path: artifacts
                - name: Require byte-identical source packages and CCX archives
                  shell: bash
                  run: |
                    node <<'NODE'
                    const fs = require('node:fs');
                    const path = require('node:path');

                    function walk(directory) {
                      return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
                        const full = path.join(directory, entry.name);
                        return entry.isDirectory() ? walk(full) : [full];
                      });
                    }

                    function one(files, predicate, label) {
                      const matches = files.filter(predicate);
                      if (matches.length !== 1) throw new Error(`expected one ${label}, found ${matches.length}`);
                      return matches[0];
                    }

                    const roots = ['distribution-Linux', 'distribution-Windows'].map((name) => path.join('artifacts', name));
                    const distributions = roots.map((root) => {
                      const files = walk(root);
                      const sourceManifest = one(files, (file) => file.endsWith('-uxp-source.manifest.json'), 'source manifest');
                      const ccxManifest = one(files, (file) => file.endsWith('.ccx.manifest.json'), 'CCX manifest');
                      const ccx = one(files, (file) => file.endsWith('.ccx'), 'CCX archive');
                      return {
                        source: JSON.parse(fs.readFileSync(sourceManifest, 'utf8')),
                        ccxMetadata: JSON.parse(fs.readFileSync(ccxManifest, 'utf8')),
                        ccx: fs.readFileSync(ccx),
                      };
                    });

                    const compactSource = (value) => JSON.stringify({
                      version: value.version,
                      packageKind: value.packageKind,
                      installable: value.installable,
                      treeSha256: value.treeSha256,
                      entries: value.entries.map(({ path, bytes, sha256 }) => ({ path, bytes, sha256 })),
                    });
                    const compactCcx = (value) => JSON.stringify({
                      version: value.version,
                      packageKind: value.packageKind,
                      sourceTreeSha256: value.sourceTreeSha256,
                      bytes: value.bytes,
                      sha256: value.sha256,
                      archive: value.archive,
                      entries: value.entries,
                    });

                    if (compactSource(distributions[0].source) !== compactSource(distributions[1].source)) {
                      throw new Error('Linux and Windows source packages differ');
                    }
                    if (compactCcx(distributions[0].ccxMetadata) !== compactCcx(distributions[1].ccxMetadata)) {
                      throw new Error('Linux and Windows CCX metadata differs');
                    }
                    if (!distributions[0].ccx.equals(distributions[1].ccx)) {
                      throw new Error('Linux and Windows CCX archives are not byte-identical');
                    }
                    NODE
          EOF

          rm -f .github/workflows/ci-hardening.yml
          git add -A .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: verify deterministic CCX on Linux and Windows"
          git push origin HEAD:main

      - name: Dispatch the permanent Product CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/product-ci.yml/dispatches" \
            -d '{"ref":"main"}'
