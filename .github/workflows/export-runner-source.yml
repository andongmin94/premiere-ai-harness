name: Export qualification runner source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-runner-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-runner-source
          path: tools/qualification-runner
          if-no-files-found: error
          retention-days: 1
