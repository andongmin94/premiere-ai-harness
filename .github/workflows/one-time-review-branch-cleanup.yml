name: One-time verified review branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-review-branch-cleanup.yml]
permissions: {}
concurrency:
  group: one-time-review-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'andongmin94/premiere-ai-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify merged trees, retain histories, and delete exact review refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote

          REPO = "andongmin94/premiere-ai-harness"
          ORIGINAL_MAIN = "c73614c3cf551b12fa6cf71952ec12f1cadc64ed"
          TARGETS = [
              (4, 'review/harden-core-0.5.1', 'eb07bd79196d82617b1f2d5877ac943c462b38af'),
              (5, 'review/improve-planner-0.5.1', 'ba90a0bd86c1e36a9146c519301ddd1cff31330b'),
              (6, 'review/harden-qualification-0.5.1', '6515141cce9c6e66b57b79e7ab2921072988a527'),
              (7, 'review/bind-transcript-provenance-0.5.1', 'b4c7b16bcff90bdea6a61129db56b647e27ecb94'),
              (8, 'review/release-evidence-0.5.1', '37bace4f3b5c2d5d34ac9295a638c394ee120ebd'),
              (9, 'review/final-distribution-evidence-0.5.1', '94177634710a661d5f4002f1a749a1cbf31fbc9d'),
              (10, 'review/evidence-workspace-init-0.5.1', '5106d5fa853caa44c89fa7cf23c04074ab7bdf34'),
              (11, 'review/source-boundary-verification-0.5.1', '3aca8512b78c83bb1a222e2afd3d1318701928c3'),
              (12, 'review/harden-transcript-input-0.5.1', '85803f9c9e461645a43ee10b6595a2dd6f67f4a1'),
              (13, 'review/source-identity-invariance-0.5.1', '5f1246eed072a0ae94eafddd3f6ff84a140e6d9f'),
              (14, 'review/persist-subclip-boundaries-0.5.1', 'b889059a220be8d84a5e97ce1d8a57ea07ae0a3c'),
              (15, 'review/persist-trackitem-source-0.5.1', '3843c09cd9a55a7c5944801abb70c70773e07475'),
              (16, 'review/isolate-planner-candidates-0.5.1', '2b28236748688499fdc2cb0c410f0099cfec5ca7'),
              (17, 'review/retake-punctuation-grace-0.5.1', '3f974dcfe8a2c3e30b3b923f36287c27f7ae07c1'),
              (18, 'review/edge-silence-candidates-0.5.1', 'dc3a056aaf9b9089771607a8e56a9dae066f9e65'),
              (19, 'review/bridge-filler-duplicates-0.5.1', '88e25576bd61646097f51a334349443d202073bf'),
              (20, 'review/ui-state-consistency-0.5.1', 'f9596db3fd9adc37088e97e69fc315ac65040a9f'),
              (21, 'review/freeze-roughcut-evidence-0.5.1', '34278bbb70dff3cbe211fa09c04532a7dcd6a917'),
              (22, 'review/code-freeze-docs-0.5.1', '694146b96ed8e4fd25709580b8201b3079cb62fa'),
          ]
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com/repos/" + REPO

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def api(path, method="GET", data=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(API + path, data=body, method=method, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "verified-review-branch-cleanup",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"{method} {path}: HTTP {error.code}") from None

          def branches():
              result = api("/branches?per_page=100")
              require(len(result) < 100, "Unexpected branch pagination; stop.")
              return {b["name"]: b["commit"]["sha"] for b in result}

          def is_ancestor(ancestor, descendant):
              comparison = api(f"/compare/{descendant}...{ancestor}?per_page=1&page=2")
              return comparison["ahead_by"] == 0 and comparison["status"] in ("behind", "identical")

          require(os.environ["GITHUB_REPOSITORY"] == REPO, "Wrong repository.")
          require(os.environ["GITHUB_REF"] == "refs/heads/main", "Only main is authorized.")
          require(api("")["default_branch"] == "main", "Default branch changed.")
          initial = branches()
          expected = {name: sha for _, name, sha in TARGETS}
          require(set(initial) == {"main", *expected}, "Branch inventory changed; stop.")
          require(all(initial[name] == sha for name, sha in expected.items()), "Branch tip changed; stop.")
          base = initial["main"]
          require(base == os.environ["GITHUB_SHA"], "main advanced after workflow creation; stop.")
          base_commit = api("/git/commits/" + base)
          require([p["sha"] for p in base_commit["parents"]] == [ORIGINAL_MAIN], "Unexpected setup parent.")
          require(not api("/pulls?state=open&per_page=1"), "An open PR exists; stop before cleanup.")

          # Audit all targets before creating any merge or deleting any branch.
          # Require both retained squash merges and exact merged-head tree equality.
          proof = []
          for number, name, sha in TARGETS:
              pr = api(f"/pulls/{number}")
              require(pr["merged"] and pr["base"]["ref"] == "main", f"PR #{number} is not merged to main.")
              require(pr["head"]["ref"] == name and pr["head"]["repo"]["full_name"] == REPO,
                      f"PR #{number} branch identity mismatch.")
              require(pr["merge_commit_sha"] and is_ancestor(pr["merge_commit_sha"], base),
                      f"PR #{number} merge is not reachable from current main.")
              tip_tree = api("/git/commits/" + sha)["tree"]["sha"]
              pr_tree = api("/git/commits/" + pr["head"]["sha"])["tree"]["sha"]
              require(tip_tree == pr_tree, f"Unmerged file changes on {name}; stop without deletion.")
              proof.append({"branch": name, "head": sha, "pr": number,
                            "merged_head": pr["head"]["sha"], "merge_commit": pr["merge_commit_sha"],
                            "tree_equal": True, "merge_reachable": True})
              print(f"VERIFIED #{number}: {name} ({sha[:12]})", flush=True)
          require(branches() == initial, "Refs changed during audit; stop before mutation.")

          # The code is already merged by squash. Preserve main's exact tree,
          # retaining original histories without reverting newer fixes.
          message = ("chore: consolidate 19 already-merged review branch histories\n\n"
                     "All PR #4-#22 merge commits verified reachable from main; every current "
                     "branch-tip tree equals its merged PR head tree. Preserve main's tree "
                     "unchanged and retain all original commits before branch cleanup.")
          merged = api("/git/commits", "POST", {
              "message": message,
              "tree": base_commit["tree"]["sha"],
              "parents": [base] + [sha for _, _, sha in TARGETS],
          })
          merge_sha = merged["sha"]
          api("/git/refs/heads/main", "PATCH", {"sha": merge_sha, "force": False})
          require(api("/git/ref/heads/main")["object"]["sha"] == merge_sha, "main changed after merge.")
          require(api("/git/commits/" + merge_sha)["tree"]["sha"] == base_commit["tree"]["sha"],
                  "Merge changed the source tree.")
          for _, name, sha in TARGETS:
              require(is_ancestor(sha, merge_sha), f"History not retained for {name}.")
          print("HISTORY_MERGE=" + merge_sha, flush=True)
          print("SOURCE_TREE_UNCHANGED=true", flush=True)

          # Recheck each exact tip and main's retained history before deletion.
          deleted = []
          for _, name, sha in TARGETS:
              ref_path = "/git/ref/heads/" + quote(name, safe="/")
              require(api(ref_path)["object"]["sha"] == sha, f"Tip changed before deletion: {name}")
              current_main = api("/git/ref/heads/main")["object"]["sha"]
              require(current_main == merge_sha or is_ancestor(merge_sha, current_main),
                      "main was rewritten; stop deleting.")
              api("/git/refs/heads/" + quote(name, safe="/"), "DELETE")
              deleted.append(name)
              print("DELETED " + name, flush=True)
          final = branches()
          require(set(final) == {"main"}, "Unexpected branches remain.")
          result = {"history_merge": merge_sha, "deleted_count": len(deleted),
                    "deleted_branches": deleted, "remaining_branches": final,
                    "source_tree_unchanged": True, "proof": proof}
          print("CLEANUP_RESULT=" + json.dumps(result, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Verified branch cleanup\n\n")
              out.write(f"Retained all 19 original histories in `{merge_sha}`.\n\n")
              out.write("Source tree unchanged. Deleted all 19 review branches; only `main` remains.\n")
          PY
